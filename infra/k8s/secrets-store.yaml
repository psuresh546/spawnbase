# ─────────────────────────────────────────
# Secrets Store CSI Driver
# SecretProviderClass for SpawnBase
# ─────────────────────────────────────────
#
# This connects Kubernetes pods to Azure
# Key Vault secrets via Workload Identity.
#
# Prerequisites (cluster-level, one-time):
#   helm repo add csi-secrets-store \
#     https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts
#   helm install csi-secrets-store \
#     csi-secrets-store/secrets-store-csi-driver \
#     --namespace kube-system \
#     --set syncSecret.enabled=true
#
#   helm repo add azure-csi \
#     https://azure.github.io/secrets-store-csi-driver-provider-azure/charts
#   helm install azure-csi \
#     azure-csi/csi-secrets-store-provider-azure \
#     --namespace kube-system
#
# ─────────────────────────────────────────
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: spawnbase-secrets
  namespace: spawnbase
spec:
  # Azure Key Vault provider
  provider: azure

  parameters:
    # Key Vault name — from Terraform output
    keyvaultName: "spawnbase-kv-dev"

    # Tenant ID — from az account show
    tenantId: "YOUR_TENANT_ID"

    # Managed Identity client ID — from Terraform output
    # managed_identity_client_id
    clientID: "YOUR_MANAGED_IDENTITY_CLIENT_ID"

    # Secrets to fetch from Key Vault
    # Each becomes a file in the pod's volume mount
    objects: |
      array:
        - |
          objectName: postgres-password
          objectType: secret
          objectVersion: ""
        - |
          objectName: jwt-secret
          objectType: secret
          objectVersion: ""
        - |
          objectName: encryption-key
          objectType: secret
          objectVersion: ""

  # Sync secrets to K8s Secret object
  # so they can be used as env vars (not just files)
  secretObjects:
    - secretName: spawnbase-secrets
      type: Opaque
      data:
        - objectName: postgres-password
          key: postgres-password
        - objectName: jwt-secret
          key: jwt-secret
        - objectName: encryption-key
          key: encryption-key