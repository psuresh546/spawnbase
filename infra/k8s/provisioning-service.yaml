apiVersion: apps/v1
kind: Deployment
metadata:
  name: provisioning-service
  namespace: spawnbase
  labels:
    app: provisioning-service
spec:
  # Single replica — Docker socket is node-local.
  # Multiple replicas would each connect to their
  # own node's Docker daemon — inconsistent state.
  # Production alternative: use DaemonSet or
  # a dedicated Docker-in-Docker sidecar.
  replicas: 1
  selector:
    matchLabels:
      app: provisioning-service
  template:
    metadata:
      labels:
        app: provisioning-service
      annotations:
        # Document the security trade-off in the manifest
        security.spawnbase.io/docker-socket: "required"
        security.spawnbase.io/reason: >
          provisioning-service calls Docker Engine API
          to create and manage database containers.
          Docker socket access is equivalent to root
          on the host — acceptable for this architecture
          because provisioning-service is internal-only
          (ClusterIP, not exposed externally).
    spec:
      serviceAccountName: spawnbase-sa

      # Pod-level security context
      securityContext:
        # Run as non-root group
        fsGroup: 999  # docker group GID on most Linux hosts

      containers:
        - name: provisioning-service
          image: spawnbaseacrdev.azurecr.io/provisioning-service:latest
          ports:
            - containerPort: 8083

          # Container-level security context
          securityContext:
            # Don't allow privilege escalation
            allowPrivilegeEscalation: false
            # Read-only root filesystem
            # (app writes to /tmp only)
            readOnlyRootFilesystem: false
            # Run as non-root user
            runAsNonRoot: false
            # Must run as root to access docker.sock
            # This is the unavoidable trade-off
            runAsUser: 0

          env:
            - name: METADATA_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: spawnbase-config
                  key: METADATA_SERVICE_URL
            - name: CREDENTIAL_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: spawnbase-config
                  key: CREDENTIAL_SERVICE_URL
            - name: DOCKER_HOST
              value: "unix:///var/run/docker.sock"

          volumeMounts:
            - name: docker-socket
              mountPath: /var/run/docker.sock

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 40
            periodSeconds: 30

      volumes:
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
            # Socket type ensures mount fails fast
            # if Docker is not running on the node
            type: Socket
---
apiVersion: v1
kind: Service
metadata:
  name: provisioning-service
  namespace: spawnbase
spec:
  selector:
    app: provisioning-service
  ports:
    - port: 8083
      targetPort: 8083
  # ClusterIP — internal only.
  # provisioning-service is never exposed
  # externally. All access goes through
  # api-gateway which enforces JWT auth.
  type: ClusterIP