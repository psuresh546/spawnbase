apiVersion: apps/v1
kind: Deployment
metadata:
  name: credential-service
  namespace: spawnbase
  labels:
    app: credential-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: credential-service
  template:
    metadata:
      labels:
        app: credential-service
    spec:
      serviceAccountName: spawnbase-sa
      containers:
        - name: credential-service
          image: spawnbaseacrdev.azurecr.io/credential-service:latest
          ports:
            - containerPort: 8084
          env:
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: spawnbase-secrets
                  key: encryption-key
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 40
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: credential-service
  namespace: spawnbase
spec:
  selector:
    app: credential-service
  ports:
    - port: 8084
      targetPort: 8084
  # Internal only — not exposed externally
  type: ClusterIP