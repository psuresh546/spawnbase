apiVersion: apps/v1
kind: Deployment
metadata:
  name: spawnbase-ui
  namespace: spawnbase
  labels:
    app: spawnbase-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spawnbase-ui
  template:
    metadata:
      labels:
        app: spawnbase-ui
    spec:
      containers:
        - name: spawnbase-ui
          image: spawnbaseacrdev.azurecr.io/spawnbase-ui:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: spawnbase-ui
  namespace: spawnbase
spec:
  selector:
    app: spawnbase-ui
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP