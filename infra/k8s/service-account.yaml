# Kubernetes Service Account for
# Workload Identity binding.
# The annotation links this SA to the
# Azure Managed Identity created in Terraform.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spawnbase-sa
  namespace: spawnbase
  annotations:
    # This annotation is what Workload Identity
    # uses to link the K8s SA to the Azure MI.
    # The client ID comes from Terraform output:
    # managed_identity_client_id
    azure.workload.identity/client-id: "REPLACE_WITH_MANAGED_IDENTITY_CLIENT_ID"
  labels:
    azure.workload.identity/use: "true"